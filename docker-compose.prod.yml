# Production (VPS) stack: the app only.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# PostgreSQL is NOT part of this file. The VPS already runs a shared-postgres
# container serving several projects, and Maap connects to it over that
# container's Docker network using its own `maap` database. DATABASE_URL comes
# from the VPS .env file next to this compose file, e.g.
#
#   DATABASE_URL=postgresql://maap:<password>@shared-postgres:5432/maap
#
# Migrations run in the entrypoint (prisma migrate deploy) before the server
# starts; no volume or database is ever destroyed by a deploy.

services:
  app:
    build:
      context: .
    image: maap:latest
    container_name: maap-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the VPS .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in the VPS .env}
      # The public origin. Auth.js builds OAuth callback URLs from it, and
      # behind a reverse proxy it cannot infer it from the request.
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set to the public origin}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      OCI_BUCKET: ${OCI_BUCKET:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_REGION: ${OCI_REGION:-}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID:-}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY:-}
      OCI_PREFIX: ${OCI_PREFIX:-maap}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      # /api/health also round-trips a query to Postgres, so an unhealthy
      # database shows up as an unhealthy container.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shared-postgres

networks:
  # The network the existing shared-postgres container is attached to. Change
  # `name` if the VPS network is called something else:
  #   docker inspect shared-postgres -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
  shared-postgres:
    external: true
    name: ${POSTGRES_NETWORK:-shared-postgres}
